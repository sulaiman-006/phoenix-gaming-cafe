<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Gaming Cafe - Admin Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 {
            color: #38bdf8;
            margin: 0;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .refresh-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .refresh-btn:hover {
            background-color: #0369a1;
        }
        /* Summary Cards Styling */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border-left: 4px solid #38bdf8;
        }
        .stat-card.ps { border-left-color: #a855f7; }
        .stat-card.steering { border-left-color: #22c55e; }
        .stat-card.vr { border-left-color: #f59e0b; }
        .stat-card h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .stat-card p {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
            color: #f8fafc;
        }
        .table-container {
            overflow-x: auto;
            background-color: #1e293b;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
            font-weight: 600;
        }
        tr:hover {
            background-color: #334155;
        }
        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .delete-btn:hover {
            background-color: #dc2626;
        }
        .no-data {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎮 Phoenix Gaming Cafe - Booking Dashboard</h1>
        <div class="btn-group">
            <button class="refresh-btn" onclick="loadAllData()">🔄 Refresh Data</button>
        </div>
    </div>

    <!-- Summary Stats Cards -->
    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Customers</h3>
            <p id="totalCustomers">0</p>
        </div>
        <div class="stat-card ps">
            <h3>PlayStation</h3>
            <p id="psCount">0</p>
        </div>
        <div class="stat-card steering">
            <h3>Steering Racing</h3>
            <p id="steeringCount">0</p>
        </div>
        <div class="stat-card vr">
            <h3>VR Games</h3>
            <p id="vrCount">0</p>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Experience</th>
                    <th>Date</th>
                    <th>Start Time</th>
                    <th>End Time</th>   
                    <th>Players</th>
                    <th>Duration</th>
                    <th>Notes</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="booking-rows">
                <tr>
                    <td colspan="11" class="no-data">Loading bookings...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadAllData() {
        await fetchBookings();
        await fetchStats();
    }

    // Helper function to calculate End Time based on Start Time and Duration
    function calculateEndTime(startTime, durationStr) {
        if (!startTime || !startTime.includes(':')) return '-';
        
        const [hours, mins] = startTime.split(':').map(Number);
        let addMins = 30; // default

        if (durationStr.includes('1 hour')) {
            addMins = 60;
        } else if (durationStr.includes('2 hours')) {
            addMins = 120;
        } else if (durationStr.includes('hour')) {
            // handle generic hours if any
            const match = durationStr.match(/(\d+)/);
            if (match) addMins = parseInt(match[1]) * 60;
        } else if (durationStr.includes('minute')) {
            const match = durationStr.match(/(\d+)/);
            if (match) addMins = parseInt(match[1]);
        }

        const dateObj = new Date(0, 0, 0, hours, mins + addMins);
        const endH = String(dateObj.getHours()).padStart(2, '0');
        const endM = String(dateObj.getMinutes()).padStart(2, '0');
        return `${endH}:${endM}`;
    }

    async function fetchBookings() {
        const tbody = document.getElementById('booking-rows');
        tbody.innerHTML = '<tr><td colspan="11" class="no-data">Loading bookings...</td></tr>';

        try {
            const response = await fetch('/api/bookings');
            const data = await response.json();

            if (data.success && data.bookings.length > 0) {
                tbody.innerHTML = '';
                data.bookings.forEach((b, index) => {
                    // 📅 Date Format Convert to DD/MM/YYYY
                    const d = new Date(b.booking_date);
                    const day = String(d.getDate()).padStart(2, '0');
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const year = d.getFullYear();
                    const formattedDate = `${day}/${month}/${year}`;

                    const startTime = b.booking_time || '-';
                    const endTime = calculateEndTime(startTime, b.duration);

                    const row = `
                        <tr>
                            <td><strong>${index + 1}</strong></td>
                            <td><strong>${b.name}</strong></td>
                            <td>${b.phone}</td>
                            <td>${b.experience}</td>
                            <td>${formattedDate}</td>
                            <td>${startTime}</td>
                            <td>${endTime}</td>
                            <td>${b.players}</td>
                            <td>${b.duration}</td>
                            <td>${b.notes || '-'}</td>
                            <td>
                                <button class="delete-btn" onclick="deleteBooking(${b.id})">🗑️ Delete</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="11" class="no-data">No bookings found yet.</td></tr>';
            }
        } catch (error) {
            console.error(error);
            tbody.innerHTML = '<tr><td colspan="11" class="no-data">Failed to load bookings.</td></tr>';
        }
    }

    async function fetchStats() {
        try {
            const response = await fetch('/api/admin/stats');
            const data = await response.json();

            if (data.success && data.stats) {
                document.getElementById('totalCustomers').innerText = data.stats.total_customers || 0;
                document.getElementById('psCount').innerText = data.stats.ps_count || 0;
                document.getElementById('steeringCount').innerText = data.stats.steering_count || 0;
                document.getElementById('vrCount').innerText = data.stats.vr_count || 0;
            }
        } catch (err) {
            console.error("Error loading stats:", err);
        }
    }

    async function deleteBooking(id) {
        if (confirm("Are you sure you want to delete this booking?")) {
            try {
                const response = await fetch('/api/bookings/' + id, { method: 'DELETE' });
                const data = await response.json();
                if (data.success) {
                    alert("Booking deleted successfully!");
                    loadAllData();
                } else {
                    alert("Error deleting booking!");
                }
            } catch (err) {
                console.error(err);
                alert("Failed to delete!");
            }
        }
    }

    // Load data automatically when page opens
    loadAllData();
</script>

</body>
</html>
